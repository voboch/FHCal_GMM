project:
  type: default
  render: [fhcal.qmd]
  pre-render:
    - python3 ../../research/evidence.py check
    - python3 check_wording.py
lang: ru
filters: [slide-body.lua]
format:
  revealjs:
    theme: [default, theme.scss, slide-layout.scss, fhcal.scss]
    css: assets/fonts.css
    embed-resources: true
    width: 1600
    height: 900
    margin: 0
    center: false
    title-slide: false
    auto-stretch: false
    slide-level: 2
    transition: none
    background-transition: none
    slide-number: c/t
    show-slide-number: all
    controls: false
    progress: false
    pdf-separate-fragments: false
    pdf-max-pages-per-slide: 1
    tbl-colwidths: false
    scroll-view:
      activation-width: 0
execute:
  enabled: false
